    <text x="310" y="250">switch B</text>
    <text x="560" y="215">Rotary A</text>
    <text x="710" y="215">Rotary B</text>
    <text x="890" y="245">switch C</text>
    <text x="1000" y="295">switch D</text>
    <text x="310" y="350">CH 3</text>
    <text x="85" y="560">CH 4</text>
    <text x="930" y="350">CH 2</text>
    <text x="705" y="560">CH 1</text>
