    <rect x="885" y="95" width="32" height="110" rx="5"/>
    <rect x="980" y="145" width="32" height="110" rx="5"/>
    <circle cx="310" cy="550" r="175"/>
    <circle cx="930" cy="550" r="175"/>
    <path d="M310 725 V377" marker-end="url(#arrow)"/>
    <path d="M485 550 H137" marker-end="url(#arrow)"/>
    <path d="M930 725 V377" marker-end="url(#arrow)"/>
    <path d="M1105 550 H757" marker-end="url(#arrow)"/>
  </g>
  <g fill="#222" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">
